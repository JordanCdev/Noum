<!doctype html><html><head><meta charset="utf-8"><title>Type · Display (Figtree)</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
body{margin:0;padding:28px;background:#fff;color:var(--fg-primary)}
.row{padding:14px 0;border-bottom:1px solid rgba(0,0,0,.06)}
.row:last-child{border-bottom:0}
.lbl{font:var(--type-caption);font-family:var(--font-text);color:var(--fg-secondary);text-transform:uppercase;letter-spacing:.6px;font-weight:700;font-size:11px;margin-bottom:6px}
.brand{font-family:var(--font-rounded);font-weight:800;letter-spacing:-0.02em;color:var(--brand-blue);font-size:14px;margin-bottom:18px}
</style></head><body>
<div class="brand">Figtree · Display / Rounded</div>
<div class="row"><div class="lbl">Display · 700 / 42</div><div style="font:var(--type-display)">Find your voice.</div></div>
<div class="row"><div class="lbl">Hero · 700 / 40</div><div style="font:var(--type-hero)">Practice on purpose.</div></div>
<div class="row"><div class="lbl">Screen title · 700 / 30</div><div style="font:var(--type-screen-title)">Choose your next rep</div></div>
<div class="row"><div class="lbl">Section hero · 600 / 26</div><div style="font:var(--type-section-hero)">Hello, Jordan</div></div>
<div class="row"><div class="lbl">Big stat · 700 / 28</div><div style="font:var(--type-big-stat)">12 streak · 4.6 avg</div></div>
<div class="row"><div class="lbl">Card title · 700 / 20</div><div style="font:var(--type-card-title)">Sudden Death</div></div>
</body></html>
