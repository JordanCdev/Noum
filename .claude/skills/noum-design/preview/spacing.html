<!doctype html><html><head><meta charset="utf-8"><title>Spacing — 8pt Grid</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>body{margin:0;padding:22px;background:#fff;color:var(--fg-primary)}.row{display:flex;align-items:center;gap:14px;padding:6px 0}.lbl{font:var(--type-caption);color:var(--fg-secondary);min-width:92px;font-family:var(--font-text)}.bar{height:14px;background:var(--brand-blue);border-radius:4px}.spec{font:var(--type-caption);color:var(--fg-primary);font-family:var(--font-text)}</style>
</head><body>
<div class="row"><span class="lbl">xxs · 4</span><span class="bar" style="width:4px"></span><span class="spec">Tight pairs</span></div>
<div class="row"><span class="lbl">xs · 8</span><span class="bar" style="width:8px"></span><span class="spec">Icon + label</span></div>
<div class="row"><span class="lbl">sm · 12</span><span class="bar" style="width:12px"></span><span class="spec">Inner spacing</span></div>
<div class="row"><span class="lbl">md · 16</span><span class="bar" style="width:16px"></span><span class="spec">Default content</span></div>
<div class="row"><span class="lbl">cardGap · 14</span><span class="bar" style="width:14px"></span><span class="spec">Between cards</span></div>
<div class="row"><span class="lbl">lg · 20</span><span class="bar" style="width:20px"></span><span class="spec">Section / screen h-padding</span></div>
</body></html>
