<!doctype html><html><head><meta charset="utf-8"><title>Radii</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>body{margin:0;padding:22px;background:#fff;color:var(--fg-primary);font-family:var(--font-rounded)}.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:14px}.sw{aspect-ratio:1/1;background:var(--brand-blue);display:flex;align-items:flex-end;justify-content:center;padding:8px;color:#fff}.meta{font:var(--type-caption);font-family:var(--font-text);text-align:center}.lbl{font-weight:800;font-size:14px}.num{opacity:.75;font-size:11px}</style>
</head><body>
<div class="grid">
  <div><div class="sw" style="border-radius:12px"><span class="meta" style="color:#fff"><span class="lbl">sm</span><br><span class="num">12px</span></span></div><div class="meta" style="padding-top:6px;color:var(--fg-secondary)">chips, tags</div></div>
  <div><div class="sw" style="border-radius:18px;background:var(--mode-sudden-death)"><span class="meta" style="color:#fff"><span class="lbl">md</span><br><span class="num">18px</span></span></div><div class="meta" style="padding-top:6px;color:var(--fg-secondary)">stat cards</div></div>
  <div><div class="sw" style="border-radius:24px;background:var(--mode-ah-counter)"><span class="meta" style="color:#fff"><span class="lbl">lg</span><br><span class="num">24px</span></span></div><div class="meta" style="padding-top:6px;color:var(--fg-secondary)">primary cards</div></div>
  <div><div class="sw" style="border-radius:28px;background:var(--mode-im)"><span class="meta" style="color:#fff"><span class="lbl">xl</span><br><span class="num">28px</span></span></div><div class="meta" style="padding-top:6px;color:var(--fg-secondary)">hero cards</div></div>
  <div><div class="sw" style="border-radius:999px;background:var(--pro)"><span class="meta" style="color:#fff"><span class="lbl">capsule</span><br><span class="num">999</span></span></div><div class="meta" style="padding-top:6px;color:var(--fg-secondary)">CTAs, nav</div></div>
</div>
</body></html>
