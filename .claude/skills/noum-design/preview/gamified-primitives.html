<!doctype html><html><head><meta charset="utf-8"><title>Gamified primitives</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
body{margin:0;padding:22px;background:#fff;color:var(--fg-primary);font-family:var(--font-rounded)}
.row{display:flex;align-items:center;gap:14px;padding:8px 0}
.lbl{font:var(--type-caption);color:var(--fg-secondary);font-family:var(--font-text);min-width:130px;font-weight:700}
.bar{flex:1;height:12px;background:rgba(0,0,0,.08);border-radius:999px;position:relative;overflow:hidden}
.fill{position:absolute;top:0;left:0;bottom:0;border-radius:999px;background:linear-gradient(90deg,#5E9BFF,var(--brand-blue),#5E9BFF);background-size:200% 100%;animation:shim 2.4s linear infinite}
@keyframes shim{0%{background-position:100% 0}100%{background-position:-100% 0}}
.badge{width:54px;height:54px;position:relative;display:inline-flex;align-items:center;justify-content:center}
.badge .ring{position:absolute;inset:0;border-radius:50%;border:1.5px solid;animation:pulse 1.8s ease-in-out infinite}
.badge .fill2{position:absolute;inset:4px;border-radius:50%;animation:pulse2 1.8s ease-in-out infinite}
.badge svg{position:relative;z-index:1}
@keyframes pulse{0%,100%{transform:scale(.92)}50%{transform:scale(1.04)}}
@keyframes pulse2{0%,100%{transform:scale(.96);opacity:.8}50%{transform:scale(1.08);opacity:1}}
.streak{display:inline-flex;align-items:center;gap:8px;background:linear-gradient(140deg,#FFB266,#E2700F);color:#fff;padding:6px 12px 6px 8px;border-radius:999px;font-family:var(--font-rounded);font-weight:800;font-size:13px;box-shadow:0 6px 14px -4px rgba(226,112,15,.5),inset 0 1px 0 rgba(255,255,255,.3)}
.streak svg{width:16px;height:16px}
.streak .num{font-size:14px;letter-spacing:.2px}
.flame{animation:flicker 1.6s ease-in-out infinite}
@keyframes flicker{0%,100%{transform:scale(1) rotate(-2deg)}50%{transform:scale(1.08) rotate(3deg)}}
</style>
</head><body>
<div class="row"><span class="lbl">ShimmerProgressBar</span><div class="bar"><div class="fill" style="width:58%"></div></div></div>
<div class="row"><span class="lbl">PulseBadge</span>
  <span class="badge"><span class="ring" style="border-color:rgba(51,120,245,.22)"></span><span class="fill2" style="background:rgba(51,120,245,.12)"></span><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#3378F5" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg></span>
  <span class="badge"><span class="ring" style="border-color:rgba(242,140,38,.24)"></span><span class="fill2" style="background:rgba(242,140,38,.14)"></span><svg width="18" height="18" viewBox="0 0 24 24" fill="#F28C26" stroke="#F28C26"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg></span>
  <span class="badge"><span class="ring" style="border-color:rgba(36,153,112,.24)"></span><span class="fill2" style="background:rgba(36,153,112,.14)"></span><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#249970" stroke-width="2.25" stroke-linecap="round"><path d="M2 12h2l2-7 4 14 4-10 2 5h6"/></svg></span>
</div>
<div class="row"><span class="lbl">StreakChip</span>
  <span class="streak"><svg class="flame" viewBox="0 0 24 24" fill="#fff"><path d="M13 2c1 4-3 5-3 9a3 3 0 1 0 6 0c0 4 3 4 3 8a7 7 0 1 1-14 0c0-5 5-7 5-12 0-2 2-4 3-5z"/></svg><span class="num">7</span> day streak</span>
  <span class="streak" style="background:linear-gradient(140deg,#5B9DFF,#2860D9);box-shadow:0 6px 14px -4px rgba(40,96,217,.5),inset 0 1px 0 rgba(255,255,255,.3)"><svg viewBox="0 0 24 24" fill="#fff"><path d="M12 2 L14 9 L21 11 L14 13 L12 20 L10 13 L3 11 L10 9 Z"/></svg><span class="num">+120</span> XP</span>
</div>
</body></html>
