name: Release readiness

on:
  pull_request:
  push:
    branches:
      - '**'
    tags:
      - 'rc-*'
  workflow_dispatch:
    inputs:
      run_full_ui_suite:
        description: Run all NoumUITests serially for a release candidate
        required: true
        type: boolean
        default: true
      run_live_web_probe:
        description: Probe all deployed launch pages
        required: true
        type: boolean
        default: false
      probe_custom_domain:
        description: Also prove noum.app before cutover
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-readiness-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  secret-history:
    name: Full-history secret scan
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
          cache: false
      - name: Install pinned Gitleaks release
        # The repository moved, but the Go module retains its original path.
        run: go install github.com/zricethezav/gitleaks/v8@v8.30.1
      - name: Scan all reachable commits with redacted output
        run: ./scripts/release-secret-scan.sh

  functions-unit:
    name: Functions lint and unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: functions/package-lock.json
      - name: Install locked Functions dependencies
        run: npm --prefix functions ci
      - name: Lint Functions
        run: npm --prefix functions run lint
      - name: Test Functions
        run: npm --prefix functions test

  functions-emulator:
    name: Auth, Firestore, and Functions integration
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: functions/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Install locked Functions dependencies
        run: npm --prefix functions ci
      - name: Run emulator integration suite
        run: ./scripts/release-functions-emulator.sh

  coach-arena:
    name: Coach regression harness
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run deterministic Node and Python suites
        run: ./tools/coach-arena/run.sh test
      - name: Validate authored coaching fixtures
        run: ./tools/coach-arena/run.sh validate

  static-readiness:
    name: Static release boundaries
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Run release and preflight unit tests
        run: python3 -m unittest discover -s scripts/tests -p 'test_*.py'
      - name: Test bundle scanner
        run: ./scripts/release-test-bundle-scan.sh
      - name: Enforce operational static readiness
        run: ./scripts/release-static-readiness.sh

  xcode-release:
    name: Xcode Release build and unit suite
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 26.3
        run: |
          xcode_path=/Applications/Xcode_26.3.app/Contents/Developer
          if [[ ! -d "$xcode_path" ]]; then
            echo "Xcode 26.3 is unavailable on the macos-26 runner." >&2
            exit 1
          fi
          sudo xcode-select --switch "$xcode_path"
          xcodebuild -version
      - name: Materialize required plist secrets
        env:
          NOUM_INFO_PLIST_BASE64: ${{ secrets.NOUM_INFO_PLIST_BASE64 }}
          NOUM_GOOGLE_SERVICE_INFO_PLIST_BASE64: ${{ secrets.NOUM_GOOGLE_SERVICE_INFO_PLIST_BASE64 }}
        run: ./scripts/release-materialize-ci-config.sh
      - name: Build Release, inspect bundle, and run unit suite
        run: ./scripts/release-xcode-ci.sh
      - name: Smoke private-beta feedback route
        run: ./scripts/release-beta-feedback-ui-smoke.sh
      - name: Verify core journey and permission recovery
        run: ./scripts/release-core-permission-ui-smoke.sh
      - name: Remove materialized plist secrets
        if: always()
        run: ./scripts/release-materialize-ci-config.sh --clean

  full-ui-release-candidate:
    name: Full serialized iOS UI release gate
    needs: xcode-release
    if: >-
      ${{ (github.event_name == 'workflow_dispatch' &&
           inputs.run_full_ui_suite) ||
          startsWith(github.ref, 'refs/tags/rc-') }}
    runs-on: macos-26
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 26.3
        run: |
          xcode_path=/Applications/Xcode_26.3.app/Contents/Developer
          if [[ ! -d "$xcode_path" ]]; then
            echo "Xcode 26.3 is unavailable on the macos-26 runner." >&2
            exit 1
          fi
          sudo xcode-select --switch "$xcode_path"
          xcodebuild -version
      - name: Materialize required plist secrets
        env:
          NOUM_INFO_PLIST_BASE64: ${{ secrets.NOUM_INFO_PLIST_BASE64 }}
          NOUM_GOOGLE_SERVICE_INFO_PLIST_BASE64: ${{ secrets.NOUM_GOOGLE_SERVICE_INFO_PLIST_BASE64 }}
        run: ./scripts/release-materialize-ci-config.sh
      - id: full-ui-suite
        name: Run every Noum UI test serially
        run: ./scripts/release-full-ui-ci.sh
      - name: Retain full UI result bundle
        if: ${{ always() && steps.full-ui-suite.outcome != 'skipped' }}
        uses: actions/upload-artifact@v4
        with:
          name: noum-full-ui-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/NoumFullUI.xcresult
          if-no-files-found: error
          retention-days: 14
      - name: Remove materialized plist secrets
        if: always()
        run: ./scripts/release-materialize-ci-config.sh --clean

  live-web:
    name: Live public pages release gate
    if: >-
      ${{ github.event_name != 'workflow_dispatch' ||
          inputs.run_live_web_probe }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Probe active Firebase Hosting pages
        run: ./scripts/release-live-web-probe.sh firebase
      - name: Prove custom-domain cutover candidate
        if: >-
          ${{ github.event_name == 'workflow_dispatch' &&
              inputs.probe_custom_domain }}
        run: ./scripts/release-live-web-probe.sh custom
