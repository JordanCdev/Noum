<!doctype html><html><head><meta charset="utf-8"><title>Buttons — Primary CTA</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>body{margin:0;padding:24px;background:#fff;color:var(--fg-primary);display:flex;flex-direction:column;gap:10px}.noum-cta{min-width:220px}.lbl{font:var(--type-caption);color:var(--fg-secondary);font-family:var(--font-text);margin-right:12px;display:inline-block;min-width:120px}.row{display:flex;align-items:center}</style>
</head><body>
<div class="row"><span class="lbl">Brand blue</span><button class="noum-cta noum-pressable">Start</button></div>
<div class="row"><span class="lbl">Timed mode</span><button class="noum-cta noum-cta--timed noum-pressable">Start <span>→</span></button></div>
<div class="row"><span class="lbl">Sudden Death</span><button class="noum-cta noum-cta--sudden-death noum-pressable">Begin <span>→</span></button></div>
<div class="row"><span class="lbl">Ah-Counter</span><button class="noum-cta noum-cta--ah-counter noum-pressable">Start <span>→</span></button></div>
<div class="row"><span class="lbl">IM Mode</span><button class="noum-cta noum-cta--im noum-pressable">Begin <span>→</span></button></div>
</body></html>
