<!doctype html><html><head><meta charset="utf-8"><title>Colors — Brand & Modes</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body{margin:0;padding:20px;background:#fff;}
  .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;}
  .sw{border-radius:16px;aspect-ratio:1.2/1;padding:10px;display:flex;flex-direction:column;justify-content:space-between;color:#fff;font-family:var(--font-rounded);box-shadow:var(--shadow-card);}
  .sw .n{font-size:11px;font-weight:700;letter-spacing:0.4px;text-transform:uppercase;opacity:.85}
  .sw .h{font-size:13px;font-weight:800;font-family:var(--font-text);letter-spacing:0.2px}
  .sw .l{font-size:14px;font-weight:800}
</style></head><body>
<div class="grid">
  <div class="sw" style="background:var(--brand-blue-gradient)"><span class="n">Brand · Blue</span><div><div class="l">brandBlue</div><div class="h">#3378F5</div></div></div>
  <div class="sw" style="background:var(--pro-gradient)"><span class="n">Pro · Premium</span><div><div class="l">pro</div><div class="h">#8F47EB</div></div></div>
  <div class="sw" style="background:var(--mode-timed)"><span class="n">Mode · Timed</span><div><div class="l">modeTimed</div><div class="h">#3378F5</div></div></div>
  <div class="sw" style="background:var(--mode-sudden-death)"><span class="n">Mode · Sudden Death</span><div><div class="l">modeSuddenDeath</div><div class="h">#F28C26</div></div></div>
  <div class="sw" style="background:var(--mode-ah-counter)"><span class="n">Mode · Ah-Counter</span><div><div class="l">modeAhCounter</div><div class="h">#249970</div></div></div>
  <div class="sw" style="background:var(--mode-im)"><span class="n">Mode · IM</span><div><div class="l">modeIM</div><div class="h">#526EF0</div></div></div>
  <div class="sw" style="background:var(--positive)"><span class="n">Semantic · Positive</span><div><div class="l">positive</div><div class="h">#199966</div></div></div>
  <div class="sw" style="background:var(--warning)"><span class="n">Semantic · Warning</span><div><div class="l">warning</div><div class="h">#BD3833</div></div></div>
</div>
</body></html>
