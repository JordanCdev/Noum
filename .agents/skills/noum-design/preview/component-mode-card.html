<!doctype html><html><head><meta charset="utf-8"><title>Mode Card</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
:root{
  --tint:#3378F5;
  --tint-light:#5E9BFF;
}
body{margin:0;padding:24px;background:var(--bg-screen);font-family:var(--font-rounded);color:var(--fg-primary);display:flex;flex-direction:column;gap:14px}

.card{
  position:relative;
  background:#fff;
  border-radius:22px;
  padding:20px;
  display:flex;align-items:center;gap:16px;
  border:1px solid rgba(15,23,42,.04);
  box-shadow:0 1px 0 rgba(15,23,42,.03), 0 14px 30px -16px color-mix(in srgb, var(--tint) 38%, transparent);
  overflow:hidden;
  transition:transform 260ms cubic-bezier(0.2,1,0.3,1);
  cursor:pointer;
}
.card:active{transform:scale(0.98)}

/* soft color-wash on the left side, fades into white */
.card::before{
  content:"";position:absolute;inset:0;pointer-events:none;
  background:
    radial-gradient(120% 100% at 0% 50%, color-mix(in srgb, var(--tint) 9%, transparent), transparent 55%);
}

/* hero icon — duotone squircle with subtle inner highlight */
.glyph{
  position:relative;
  width:56px;height:56px;border-radius:16px;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
  background:color-mix(in srgb, var(--tint) 14%, #fff);
  color:var(--tint);
  z-index:1;
}
.glyph::after{
  content:"";position:absolute;inset:0;border-radius:16px;
  background:linear-gradient(180deg, rgba(255,255,255,.55), rgba(255,255,255,0) 60%);
  pointer-events:none;
}

.body{position:relative;z-index:1;flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.title{
  font-family:var(--font-rounded);font-weight:800;font-size:18px;letter-spacing:-0.01em;line-height:1.15;
  margin:0;color:var(--fg-primary);
}
.meta{
  display:flex;align-items:center;gap:8px;
  font-family:var(--font-text);font-weight:700;font-size:12px;color:var(--fg-secondary);
}
.spec{font-variant-numeric:tabular-nums}
.dot{width:3px;height:3px;border-radius:50%;background:rgba(105,115,130,.45)}
.bestat{color:var(--tint)}

/* press-affordance arrow — soft tinted disc */
.go{
  position:relative;z-index:1;
  width:34px;height:34px;border-radius:50%;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
  background:color-mix(in srgb, var(--tint) 12%, #fff);
  color:var(--tint);
}

/* ──────────── per-mode tints ──────────── */
.suddenDeath{--tint:#F28C26;--tint-light:#FFB066}
.ahCounter  {--tint:#249970;--tint-light:#4FC49A}
.imMode     {--tint:#526EF0;--tint-light:#7D92F5}
</style>
</head><body>

<!-- Timed Practice (default brand blue) -->
<div class="card">
  <div class="glyph">
    <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.85" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="13" r="8.5" fill="currentColor" fill-opacity=".18"/>
      <path d="M12 13 L12 8"/>
      <path d="M12 13 L15.6 14.6" opacity=".7"/>
      <rect x="9.5" y="2" width="5" height="2.5" rx="1" fill="currentColor" stroke="none"/>
    </svg>
  </div>
  <div class="body">
    <h3 class="title">Timed Practice</h3>
    <div class="meta">
      <span class="spec">30 · 60 · 90s</span>
      <span class="dot"></span>
      <span class="bestat">Best for structure</span>
    </div>
  </div>
  <div class="go">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
  </div>
</div>

<!-- Sudden Death -->
<div class="card suddenDeath">
  <div class="glyph">
    <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.85" stroke-linecap="round" stroke-linejoin="round">
      <path d="M13 2 L4 14 L11 14 L10 22 L20 10 L13 10 Z" fill="currentColor" fill-opacity=".18"/>
    </svg>
  </div>
  <div class="body">
    <h3 class="title">Sudden Death</h3>
    <div class="meta">
      <span class="spec">No fillers, stay alive</span>
      <span class="dot"></span>
      <span class="bestat">Best under pressure</span>
    </div>
  </div>
  <div class="go">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
  </div>
</div>

<!-- Ah-Counter -->
<div class="card ahCounter">
  <div class="glyph">
    <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M3 12h2M7 8v8M11 4v16M15 7v10M19 10v4M21 12h-1"/>
    </svg>
  </div>
  <div class="body">
    <h3 class="title">Ah-Counter</h3>
    <div class="meta">
      <span class="spec">Live filler tracking</span>
      <span class="dot"></span>
      <span class="bestat">Best for cleaner reps</span>
    </div>
  </div>
  <div class="go">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
  </div>
</div>

<!-- IM Mode -->
<div class="card imMode">
  <div class="glyph">
    <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.85" stroke-linecap="round" stroke-linejoin="round">
      <path d="M4 6h14a2 2 0 0 1 2 2v6a2 2 0 0 1-2 2H10l-4 4v-4H4a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2z" fill="currentColor" fill-opacity=".18"/>
    </svg>
  </div>
  <div class="body">
    <h3 class="title">IM Mode</h3>
    <div class="meta">
      <span class="spec">Live conversation</span>
      <span class="dot"></span>
      <span class="bestat">Best for tone &amp; realism</span>
    </div>
  </div>
  <div class="go">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
  </div>
</div>

</body></html>
