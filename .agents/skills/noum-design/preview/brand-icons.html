<!doctype html><html><head><meta charset="utf-8"><title>Brand · Icon tokens</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
body{margin:0;padding:22px;background:#fff;font-family:var(--font-rounded);color:var(--fg-primary)}
.grid{display:grid;grid-template-columns:repeat(6,1fr);gap:14px;text-align:center}
.cell{display:flex;flex-direction:column;align-items:center;gap:8px;padding:14px 6px;border-radius:16px;background:linear-gradient(180deg,#FBFBFD,#F4F4F8);box-shadow:inset 0 0 0 1px rgba(15,23,42,.04), 0 1px 2px rgba(15,23,42,.04)}
.ico{width:32px;height:32px;display:flex;align-items:center;justify-content:center}
svg{width:32px;height:32px;overflow:visible}
.n{font-family:var(--font-text);color:var(--fg-secondary);font-weight:700;font-size:10px;letter-spacing:.3px}
</style>
<defs></defs>
</head><body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <linearGradient id="g-blue" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5B9DFF"/><stop offset="1" stop-color="#2860D9"/></linearGradient>
    <linearGradient id="g-orange" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFB266"/><stop offset="1" stop-color="#E2700F"/></linearGradient>
    <linearGradient id="g-green" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4CD9A1"/><stop offset="1" stop-color="#159062"/></linearGradient>
    <linearGradient id="g-purple" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#B488FF"/><stop offset="1" stop-color="#6B2EC9"/></linearGradient>
    <linearGradient id="g-red" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FF7A6E"/><stop offset="1" stop-color="#A82A22"/></linearGradient>
    <linearGradient id="g-amber" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFE36E"/><stop offset="1" stop-color="#D69113"/></linearGradient>
    <linearGradient id="g-slate" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#94A3B8"/><stop offset="1" stop-color="#475569"/></linearGradient>
    <linearGradient id="g-shine" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".55"/><stop offset=".55" stop-color="#fff" stop-opacity="0"/></linearGradient>
    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="0.6" in="SourceAlpha"/>
      <feOffset dx="0" dy="0.6" result="off"/>
      <feComponentTransfer in="off" result="sh"><feFuncA type="linear" slope="0.35"/></feComponentTransfer>
      <feMerge><feMergeNode in="sh"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
</svg>

<div class="grid">

  <!-- timer -->
  <div class="cell"><svg viewBox="0 0 32 32" filter="url(#softShadow)">
    <circle cx="16" cy="17" r="11" fill="url(#g-blue)"/>
    <path d="M16 17 L16 10" stroke="#fff" stroke-width="2.4" stroke-linecap="round"/>
    <path d="M16 17 L21 19.5" stroke="#fff" stroke-width="2.4" stroke-linecap="round" opacity=".75"/>
    <circle cx="16" cy="17" r="1.6" fill="#fff"/>
    <rect x="13" y="3" width="6" height="3" rx="1" fill="url(#g-blue)"/>
    <ellipse cx="16" cy="11" rx="11" ry="3" fill="url(#g-shine)"/>
  </svg><div class="n">timer</div></div>

  <!-- bolt -->
  <div class="cell"><svg viewBox="0 0 32 32" filter="url(#softShadow)">
    <path d="M18 3 L7 18 L14 18 L13 29 L25 13 L17.5 13 Z" fill="url(#g-orange)"/>
    <path d="M18 3 L7 18 L14 18 L13 29 L25 13 L17.5 13 Z" fill="url(#g-shine)" opacity=".7"/>
  </svg><div class="n">bolt</div></div>

  <!-- waveform / streak -->
  <div class="cell"><svg viewBox="0 0 32 32">
    <g stroke="url(#g-green)" stroke-width="2.6" stroke-linecap="round" fill="none">
      <line x1="4" y1="16" x2="4" y2="16"/>
      <line x1="9" y1="12" x2="9" y2="20"/>
      <line x1="14" y1="7" x2="14" y2="25"/>
      <line x1="19" y1="10" x2="19" y2="22"/>
      <line x1="24" y1="14" x2="24" y2="18"/>
      <line x1="28" y1="16" x2="28" y2="16"/>
    </g>
  </svg><div class="n">waveform</div></div>

  <!-- message bubble (matches Noum brand) -->
  <div class="cell"><svg viewBox="0 0 32 32" filter="url(#softShadow)">
    <path d="M6 6 H26 a3 3 0 0 1 3 3 v11 a3 3 0 0 1 -3 3 H14 l-6 5 v-5 H6 a3 3 0 0 1 -3 -3 V9 a3 3 0 0 1 3 -3 Z" fill="url(#g-orange)"/>
    <path d="M6 6 H26 a3 3 0 0 1 3 3 v6 H3 V9 a3 3 0 0 1 3 -3 Z" fill="url(#g-shine)" opacity=".75"/>
    <circle cx="11" cy="15" r="1.6" fill="#fff"/>
    <circle cx="16" cy="15" r="1.6" fill="#fff"/>
    <circle cx="21" cy="15" r="1.6" fill="#fff"/>
  </svg><div class="n">message</div></div>

  <!-- dumbbell -->
  <div class="cell"><svg viewBox="0 0 32 32" filter="url(#softShadow)">
    <rect x="2"  y="13" width="3.5" height="6" rx="1.2" fill="url(#g-blue)"/>
    <rect x="26.5" y="13" width="3.5" height="6" rx="1.2" fill="url(#g-blue)"/>
    <rect x="6"  y="10" width="4" height="12" rx="1.4" fill="url(#g-blue)"/>
    <rect x="22" y="10" width="4" height="12" rx="1.4" fill="url(#g-blue)"/>
    <rect x="10" y="14.4" width="12" height="3.2" rx="1" fill="url(#g-blue)"/>
    <rect x="6"  y="10" width="4" height="4" rx="1.4" fill="url(#g-shine)" opacity=".7"/>
    <rect x="22" y="10" width="4" height="4" rx="1.4" fill="url(#g-shine)" opacity=".7"/>
  </svg><div class="n">dumbbell</div></div>

  <!-- people -->
  <div class="cell"><svg viewBox="0 0 32 32" filter="url(#softShadow)">
    <circle cx="11" cy="11" r="4.5" fill="url(#g-purple)"/>
    <path d="M3 26 c0-5 4-8 8-8 s8 3 8 8 z" fill="url(#g-purple)"/>
    <circle cx="22" cy="13" r="3.6" fill="url(#g-purple)" opacity=".88"/>
    <path d="M17 26 c0-3.5 2.5-5.5 5-5.5 s5 2 6 5.5 z" fill="url(#g-purple)" opacity=".88"/>
    <ellipse cx="11" cy="9" rx="3.4" ry="1.6" fill="url(#g-shine)" opacity=".85"/>
  </svg><div class="n">people</div></div>

  <!-- star -->
  <div class="cell"><svg viewBox="0 0 32 32" filter="url(#softShadow)">
    <path d="M16 3 L20 12 L30 13 L22.5 19.5 L25 29 L16 24 L7 29 L9.5 19.5 L2 13 L12 12 Z" fill="url(#g-amber)"/>
    <path d="M16 3 L20 12 L30 13 L22.5 19.5 L25 29 L16 24 L7 29 L9.5 19.5 L2 13 L12 12 Z" fill="url(#g-shine)" opacity=".55"/>
  </svg><div class="n">star</div></div>

  <!-- sparkles -->
  <div class="cell"><svg viewBox="0 0 32 32" filter="url(#softShadow)">
    <path d="M18 4 L20 11 L27 13 L20 15 L18 22 L16 15 L9 13 L16 11 Z" fill="url(#g-purple)"/>
    <path d="M8 19 L9 22 L12 23 L9 24 L8 27 L7 24 L4 23 L7 22 Z" fill="url(#g-purple)" opacity=".9"/>
    <path d="M25 22 L25.7 24 L28 24.5 L25.7 25 L25 27 L24.3 25 L22 24.5 L24.3 24 Z" fill="url(#g-purple)" opacity=".7"/>
  </svg><div class="n">sparkles</div></div>

  <!-- check circle -->
  <div class="cell"><svg viewBox="0 0 32 32" filter="url(#softShadow)">
    <circle cx="16" cy="16" r="13" fill="url(#g-green)"/>
    <ellipse cx="16" cy="9" rx="11" ry="3" fill="url(#g-shine)" opacity=".6"/>
    <path d="M9.5 16.5 L14 21 L23 11.5" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </svg><div class="n">check</div></div>

  <!-- alert -->
  <div class="cell"><svg viewBox="0 0 32 32" filter="url(#softShadow)">
    <path d="M16 3 L30 27 a2 2 0 0 1 -1.7 3 H3.7 a2 2 0 0 1 -1.7 -3 Z" fill="url(#g-red)"/>
    <path d="M16 3 L30 27 a2 2 0 0 1 -1.7 3 H3.7 a2 2 0 0 1 -1.7 -3 Z" fill="url(#g-shine)" opacity=".5"/>
    <rect x="14.7" y="12" width="2.6" height="9" rx="1.3" fill="#fff"/>
    <circle cx="16" cy="25" r="1.6" fill="#fff"/>
  </svg><div class="n">alert</div></div>

  <!-- chevron -->
  <div class="cell"><svg viewBox="0 0 32 32" filter="url(#softShadow)">
    <circle cx="16" cy="16" r="13" fill="url(#g-slate)"/>
    <ellipse cx="16" cy="9" rx="11" ry="3" fill="url(#g-shine)" opacity=".55"/>
    <path d="M14 10 L20 16 L14 22" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </svg><div class="n">chevron</div></div>

  <!-- mic -->
  <div class="cell"><svg viewBox="0 0 32 32" filter="url(#softShadow)">
    <rect x="12" y="3" width="8" height="16" rx="4" fill="url(#g-red)"/>
    <rect x="12" y="3" width="8" height="6" rx="4" fill="url(#g-shine)" opacity=".7"/>
    <path d="M7 16 a9 9 0 0 0 18 0" stroke="url(#g-red)" stroke-width="2.6" fill="none" stroke-linecap="round"/>
    <line x1="16" y1="25" x2="16" y2="29" stroke="url(#g-red)" stroke-width="2.6" stroke-linecap="round"/>
    <line x1="12" y1="29" x2="20" y2="29" stroke="url(#g-red)" stroke-width="2.6" stroke-linecap="round"/>
  </svg><div class="n">mic</div></div>

</div>
</body></html>
