<!doctype html><html><head><meta charset="utf-8"><title>Bottom nav</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
body{margin:0;padding:18px;background:var(--bg-screen);font-family:var(--font-rounded);display:flex;align-items:center;justify-content:center}
.nav{background:rgba(255,255,255,.72);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-radius:999px;border:1px solid rgba(255,255,255,.55);padding:10px 12px;display:flex;gap:10px;box-shadow:var(--shadow-card)}
.item{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;min-width:60px}
.circ{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center}
.lbl{font:var(--type-nav);letter-spacing:.4px;text-transform:uppercase;font-weight:700;font-size:10px}
</style></head><body>
<div class="nav">
  <!-- TRAIN: dumbbell -->
  <div class="item">
    <div class="circ" style="background:rgba(51,120,245,.12)">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#3378F5" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="2.5" y="9" width="3" height="6" rx="1"/>
        <rect x="18.5" y="9" width="3" height="6" rx="1"/>
        <rect x="6" y="7" width="2.5" height="10" rx="0.8"/>
        <rect x="15.5" y="7" width="2.5" height="10" rx="0.8"/>
        <line x1="8.5" y1="12" x2="15.5" y2="12"/>
      </svg>
    </div>
    <span class="lbl" style="color:#3378F5d9">TRAIN</span>
  </div>

  <!-- REVIEW: clipboard with check -->
  <div class="item">
    <div class="circ" style="background:rgba(242,140,38,.12)">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#F28C26" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="5" y="4" width="14" height="17" rx="2"/>
        <rect x="9" y="2.5" width="6" height="3" rx="1" fill="#F28C26"/>
        <path d="M9 13 11 15 15 10"/>
      </svg>
    </div>
    <span class="lbl" style="color:#F28C26d9">REVIEW</span>
  </div>

  <!-- SOCIAL: two people -->
  <div class="item">
    <div class="circ" style="background:rgba(143,71,235,.12)">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#8F47EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="9" cy="8" r="3.2"/>
        <path d="M3 20c0-3.3 2.7-6 6-6s6 2.7 6 6"/>
        <circle cx="17" cy="9" r="2.6"/>
        <path d="M14.5 20c0-2.5 1.7-4.5 4.2-4.5 1 0 1.9.3 2.6.8"/>
      </svg>
    </div>
    <span class="lbl" style="color:#8F47EBd9">SOCIAL</span>
  </div>

  <!-- SETTINGS: gear -->
  <div class="item">
    <div class="circ" style="background:rgba(36,153,112,.12)">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#249970" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="3"/>
        <path d="M12 2.5v2.6 M12 18.9v2.6 M2.5 12h2.6 M18.9 12h2.6 M5.2 5.2 7 7 M17 17l1.8 1.8 M5.2 18.8 7 17 M17 7l1.8-1.8"/>
      </svg>
    </div>
    <span class="lbl" style="color:#249970d9">SETTINGS</span>
  </div>
</div>
</body></html>
