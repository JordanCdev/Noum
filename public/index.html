<style>
  :root {
    --brand-blue: #2F6FED;
    --bg: #F2F3F7;
    --card: #FFFFFF;
    --ink: #0E0F12;
    --ink-secondary: #5C6068;
    --ink-tertiary: #8B8F97;
    --border: rgba(14, 15, 18, 0.08);
    --radius: 20px;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--ink);
    font: 16px/1.55 -apple-system, "SF Pro Text", "Helvetica Neue", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
  }
  main {
    max-width: 540px;
    margin: 0 auto;
    padding: 80px 24px;
    text-align: center;
  }
  .brand-dot {
    width: 56px;
    height: 56px;
    border-radius: 14px;
    background: var(--brand-blue);
    margin: 0 auto 20px;
  }
  h1 {
    font-size: 36px;
    margin: 0 0 12px;
    letter-spacing: -0.02em;
    font-weight: 700;
  }
  p {
    color: var(--ink-secondary);
    margin: 0 0 24px;
    line-height: 1.55;
  }
  .links {
    display: flex;
    gap: 16px;
    justify-content: center;
    flex-wrap: wrap;
    margin-top: 32px;
  }
  a.link {
    color: var(--brand-blue);
    text-decoration: none;
    font-weight: 600;
    padding: 10px 18px;
    border-radius: 999px;
    border: 1px solid rgba(47, 111, 237, 0.20);
  }
  a.link:hover { background: rgba(47, 111, 237, 0.06); }
  footer {
    margin-top: 64px;
    color: var(--ink-tertiary);
    font-size: 13px;
  }
</style>

  <div class="links">
    <a class="link" href="/privacy">Privacy policy</a>
  </div>
  <footer>&copy; 2026 Noum</footer>
