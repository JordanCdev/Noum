<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  html,body{margin:0;padding:0}
  body{width:1600px;height:1040px;background:#0a0c14;
    font-family:-apple-system,"SF Pro Display","Helvetica Neue",Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;text-rendering:geometricPrecision;}
  text{font-family:-apple-system,"SF Pro Display","Helvetica Neue",Helvetica,Arial,sans-serif;}
</style>
</head>
<body>
<svg width="1600" height="1040" viewBox="0 0 1600 1040" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bg" cx="50%" cy="14%" r="95%">
      <stop offset="0%" stop-color="#1a1e36"/>
      <stop offset="55%" stop-color="#0e1020"/>
      <stop offset="100%" stop-color="#070811"/>
    </radialGradient>
    <radialGradient id="purpleGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#E9D4FF" stop-opacity="0.95"/>
      <stop offset="45%" stop-color="#9A55EE" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#9A55EE" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orbCore" cx="38%" cy="30%" r="78%">
      <stop offset="0%" stop-color="#D2AEF9"/>
      <stop offset="48%" stop-color="#8F47EB"/>
      <stop offset="100%" stop-color="#5A24A6"/>
    </radialGradient>
    <linearGradient id="bluePurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#42A1FF"/>
      <stop offset="100%" stop-color="#8F47EB"/>
    </linearGradient>
    <radialGradient id="avatarForm" cx="40%" cy="28%" r="80%">
      <stop offset="0%" stop-color="#CBD3FF"/>
      <stop offset="42%" stop-color="#7E78E6"/>
      <stop offset="100%" stop-color="#473F92"/>
    </radialGradient>
    <linearGradient id="bust" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#6A6FD0"/>
      <stop offset="100%" stop-color="#3B3680"/>
    </linearGradient>
    <linearGradient id="spectrum" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2BB98A"/>
      <stop offset="38%" stop-color="#E5A53A"/>
      <stop offset="70%" stop-color="#EE8A3C"/>
      <stop offset="100%" stop-color="#F0653E"/>
    </linearGradient>
    <filter id="bigGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
    <filter id="softGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
    <filter id="haze" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
  </defs>

  <rect width="1600" height="1040" fill="url(#bg)"/>

  <!-- ============ HEADER ============ -->
  <text x="80" y="66" fill="#9B9BC4" font-size="17" font-weight="600" letter-spacing="7">NOUM</text>
  <text x="80" y="120" fill="#F4F4FB" font-size="42" font-weight="200" letter-spacing="0.5">Coach Presence <tspan fill="#7C7CA6" font-weight="200">— Concept Directions</tspan></text>
  <text x="1520" y="60" fill="#8585B0" font-size="14" font-weight="600" letter-spacing="4" text-anchor="end">TALK WITH NOUM</text>
  <text x="1520" y="92" fill="#B9B9D6" font-size="17" font-weight="300" text-anchor="end">How the coach shows up in conversation</text>
  <text x="1520" y="116" fill="#5E5E86" font-size="14" font-weight="300" text-anchor="end">Choose a direction · then it gets built &amp; verified in-app</text>
  <line x1="80" y1="150" x2="1520" y2="150" stroke="#FFFFFF" stroke-opacity="0.09"/>

  <!-- ============ COLUMN 01 — LIVING ORB ============ -->
  <g transform="translate(80,0)">
    <rect x="0" y="184" width="330" height="700" rx="26" fill="#FFFFFF" fill-opacity="0.028" stroke="#FFFFFF" stroke-opacity="0.06"/>
    <text x="26" y="232" fill="#6E6E98" font-size="26" font-weight="300" letter-spacing="2">01</text>

    <!-- halos -->
    <circle cx="165" cy="346" r="90" fill="none" stroke="#D185FF" stroke-opacity="0.10" stroke-width="1.5"/>
    <circle cx="165" cy="346" r="74" fill="none" stroke="#D185FF" stroke-opacity="0.16" stroke-width="1.5"/>
    <!-- glow -->
    <circle cx="165" cy="346" r="66" fill="url(#purpleGlow)" filter="url(#bigGlow)"/>
    <!-- core -->
    <circle cx="165" cy="346" r="54" fill="url(#orbCore)"/>
    <circle cx="165" cy="346" r="54" fill="none" stroke="#FFFFFF" stroke-opacity="0.16" stroke-width="1.2"/>
    <!-- waveform (no face) -->
    <g fill="#F4ECFF" fill-opacity="0.92">
      <rect x="119" y="331" width="8" height="30" rx="4"/>
      <rect x="133" y="322" width="8" height="48" rx="4"/>
      <rect x="147" y="314" width="8" height="64" rx="4"/>
      <rect x="161" y="326" width="8" height="40" rx="4"/>
      <rect x="175" y="318" width="8" height="56" rx="4"/>
      <rect x="189" y="329" width="8" height="34" rx="4"/>
      <rect x="203" y="323" width="8" height="46" rx="4"/>
    </g>

    <text x="165" y="492" fill="#F2F2FA" font-size="25" font-weight="500" text-anchor="middle">Living Orb</text>
    <text x="165" y="524" fill="#A6A6CA" font-size="15.5" font-weight="300" text-anchor="middle">Today's waveform orb, given breath.</text>
    <text x="165" y="546" fill="#A6A6CA" font-size="15.5" font-weight="300" text-anchor="middle">A reacting presence — no face.</text>

    <!-- in-chat vignette -->
    <rect x="34" y="592" width="262" height="92" rx="18" fill="#FFFFFF"/>
    <circle cx="74" cy="638" r="20" fill="url(#orbCore)"/>
    <g fill="#F4ECFF" fill-opacity="0.95">
      <rect x="66" y="632" width="3.4" height="12" rx="1.7"/><rect x="71" y="628" width="3.4" height="20" rx="1.7"/>
      <rect x="76" y="625" width="3.4" height="26" rx="1.7"/><rect x="81" y="630" width="3.4" height="16" rx="1.7"/>
    </g>
    <rect x="108" y="618" width="160" height="9" rx="4.5" fill="#C9CEDC"/>
    <rect x="108" y="636" width="178" height="9" rx="4.5" fill="#D7DBE6"/>
    <rect x="108" y="654" width="120" height="9" rx="4.5" fill="#E2E5EE"/>

    <!-- brand tag -->
    <rect x="79" y="788" width="172" height="34" rx="17" fill="#2BB98A" fill-opacity="0.16" stroke="#2BB98A" stroke-opacity="0.55"/>
    <text x="165" y="810" fill="#54D6A8" font-size="12.5" font-weight="600" letter-spacing="1.2" text-anchor="middle">ON-BRAND · NO FACE</text>
  </g>

  <!-- ============ COLUMN 02 — ORB + FACE ============ -->
  <g transform="translate(450,0)">
    <rect x="0" y="184" width="330" height="700" rx="26" fill="#FFFFFF" fill-opacity="0.028" stroke="#FFFFFF" stroke-opacity="0.06"/>
    <text x="26" y="232" fill="#6E6E98" font-size="26" font-weight="300" letter-spacing="2">02</text>

    <circle cx="165" cy="346" r="90" fill="none" stroke="#D185FF" stroke-opacity="0.10" stroke-width="1.5"/>
    <circle cx="165" cy="346" r="74" fill="none" stroke="#D185FF" stroke-opacity="0.16" stroke-width="1.5"/>
    <circle cx="165" cy="346" r="66" fill="url(#purpleGlow)" filter="url(#bigGlow)"/>
    <circle cx="165" cy="346" r="54" fill="url(#orbCore)"/>
    <circle cx="165" cy="346" r="54" fill="none" stroke="#FFFFFF" stroke-opacity="0.16" stroke-width="1.2"/>

    <!-- eyes -->
    <ellipse cx="148" cy="332" rx="5.2" ry="8.4" fill="#FBF7FF"/>
    <ellipse cx="182" cy="332" rx="5.2" ry="8.4" fill="#FBF7FF"/>
    <circle cx="149.5" cy="330" r="1.8" fill="#6A33B8"/>
    <circle cx="183.5" cy="330" r="1.8" fill="#6A33B8"/>
    <!-- mouth = waveform -->
    <g fill="#F4ECFF" fill-opacity="0.9">
      <rect x="143" y="361" width="6" height="11" rx="3"/>
      <rect x="153" y="357" width="6" height="19" rx="3"/>
      <rect x="163" y="354" width="6" height="25" rx="3"/>
      <rect x="173" y="358" width="6" height="17" rx="3"/>
      <rect x="183" y="362" width="6" height="10" rx="3"/>
    </g>

    <text x="165" y="492" fill="#F2F2FA" font-size="25" font-weight="500" text-anchor="middle">Orb + Face</text>
    <text x="165" y="524" fill="#A6A6CA" font-size="15.5" font-weight="300" text-anchor="middle">Eyes that blink and track you;</text>
    <text x="165" y="546" fill="#A6A6CA" font-size="15.5" font-weight="300" text-anchor="middle">the waveform becomes a mouth.</text>

    <rect x="34" y="592" width="262" height="92" rx="18" fill="#FFFFFF"/>
    <circle cx="74" cy="638" r="20" fill="url(#orbCore)"/>
    <ellipse cx="68" cy="633" rx="2.1" ry="3.4" fill="#FBF7FF"/>
    <ellipse cx="80" cy="633" rx="2.1" ry="3.4" fill="#FBF7FF"/>
    <g fill="#F4ECFF" fill-opacity="0.9">
      <rect x="68" y="645" width="2.6" height="6" rx="1.3"/><rect x="73" y="643" width="2.6" height="10" rx="1.3"/>
      <rect x="78" y="645" width="2.6" height="6" rx="1.3"/>
    </g>
    <rect x="108" y="618" width="160" height="9" rx="4.5" fill="#C9CEDC"/>
    <rect x="108" y="636" width="178" height="9" rx="4.5" fill="#D7DBE6"/>
    <rect x="108" y="654" width="120" height="9" rx="4.5" fill="#E2E5EE"/>

    <rect x="63" y="788" width="204" height="34" rx="17" fill="#E5A53A" fill-opacity="0.16" stroke="#E5A53A" stroke-opacity="0.55"/>
    <text x="165" y="810" fill="#F0B85B" font-size="12" font-weight="600" letter-spacing="0.8" text-anchor="middle">STRETCHES “NO CHARACTERS”</text>
  </g>

  <!-- ============ COLUMN 03 — GEOMETRIC COACH ============ -->
  <g transform="translate(820,0)">
    <rect x="0" y="184" width="330" height="700" rx="26" fill="#FFFFFF" fill-opacity="0.028" stroke="#FFFFFF" stroke-opacity="0.06"/>
    <text x="26" y="232" fill="#6E6E98" font-size="26" font-weight="300" letter-spacing="2">03</text>

    <!-- glow behind body -->
    <rect x="108" y="294" width="114" height="124" rx="50" fill="url(#bluePurple)" opacity="0.5" filter="url(#bigGlow)"/>
    <!-- body -->
    <rect x="110" y="296" width="110" height="120" rx="48" fill="url(#bluePurple)"/>
    <rect x="110" y="296" width="110" height="120" rx="48" fill="none" stroke="#FFFFFF" stroke-opacity="0.18" stroke-width="1.2"/>
    <!-- soft top highlight -->
    <ellipse cx="150" cy="322" rx="34" ry="20" fill="#FFFFFF" opacity="0.14" filter="url(#haze)"/>
    <!-- eyes -->
    <ellipse cx="146" cy="344" rx="12" ry="14" fill="#FFFFFF"/>
    <ellipse cx="184" cy="344" rx="12" ry="14" fill="#FFFFFF"/>
    <circle cx="148" cy="347" r="5.4" fill="#2E2658"/>
    <circle cx="186" cy="347" r="5.4" fill="#2E2658"/>
    <circle cx="150" cy="345" r="1.8" fill="#FFFFFF"/>
    <circle cx="188" cy="345" r="1.8" fill="#FFFFFF"/>
    <!-- waveform accent (chest) -->
    <g fill="#EAF1FF" fill-opacity="0.55">
      <rect x="143" y="386" width="4.6" height="9" rx="2.3"/>
      <rect x="151" y="383" width="4.6" height="15" rx="2.3"/>
      <rect x="159" y="381" width="4.6" height="19" rx="2.3"/>
      <rect x="167" y="384" width="4.6" height="13" rx="2.3"/>
      <rect x="175" y="387" width="4.6" height="8" rx="2.3"/>
    </g>

    <text x="165" y="492" fill="#F2F2FA" font-size="25" font-weight="500" text-anchor="middle">Geometric Coach</text>
    <text x="165" y="524" fill="#A6A6CA" font-size="15.5" font-weight="300" text-anchor="middle">An abstract character — friendly</text>
    <text x="165" y="546" fill="#A6A6CA" font-size="15.5" font-weight="300" text-anchor="middle">eyes, a waveform heart.</text>

    <rect x="34" y="592" width="262" height="92" rx="18" fill="#FFFFFF"/>
    <rect x="56" y="620" width="38" height="40" rx="16" fill="url(#bluePurple)"/>
    <ellipse cx="68" cy="636" rx="4" ry="5" fill="#FFFFFF"/><ellipse cx="82" cy="636" rx="4" ry="5" fill="#FFFFFF"/>
    <circle cx="69" cy="637" r="1.8" fill="#2E2658"/><circle cx="83" cy="637" r="1.8" fill="#2E2658"/>
    <rect x="112" y="618" width="156" height="9" rx="4.5" fill="#C9CEDC"/>
    <rect x="112" y="636" width="174" height="9" rx="4.5" fill="#D7DBE6"/>
    <rect x="112" y="654" width="116" height="9" rx="4.5" fill="#E2E5EE"/>

    <rect x="61" y="788" width="208" height="34" rx="17" fill="#EE8A3C" fill-opacity="0.16" stroke="#EE8A3C" stroke-opacity="0.55"/>
    <text x="165" y="810" fill="#F4A363" font-size="12" font-weight="600" letter-spacing="0.8" text-anchor="middle">RELAXES “NO CHARACTERS”</text>
  </g>

  <!-- ============ COLUMN 04 — RENDERED AVATAR ============ -->
  <g transform="translate(1190,0)">
    <rect x="0" y="184" width="330" height="700" rx="26" fill="#FFFFFF" fill-opacity="0.028" stroke="#FFFFFF" stroke-opacity="0.06"/>
    <text x="26" y="232" fill="#6E6E98" font-size="26" font-weight="300" letter-spacing="2">04</text>

    <!-- aura -->
    <circle cx="165" cy="338" r="78" fill="url(#avatarForm)" opacity="0.35" filter="url(#bigGlow)"/>
    <!-- shoulders / bust -->
    <path d="M104,420 Q104,366 165,366 Q226,366 226,420 L226,424 L104,424 Z" fill="url(#bust)"/>
    <!-- collar waveform accent -->
    <g fill="#D9E0FF" fill-opacity="0.45">
      <rect x="150" y="398" width="3.6" height="9" rx="1.8"/><rect x="157" y="395" width="3.6" height="15" rx="1.8"/>
      <rect x="164" y="393" width="3.6" height="19" rx="1.8"/><rect x="171" y="396" width="3.6" height="13" rx="1.8"/>
      <rect x="178" y="399" width="3.6" height="8" rx="1.8"/>
    </g>
    <!-- head -->
    <circle cx="165" cy="318" r="47" fill="url(#avatarForm)"/>
    <ellipse cx="150" cy="300" rx="20" ry="13" fill="#FFFFFF" opacity="0.20" filter="url(#haze)"/>
    <!-- calm eyes -->
    <path d="M146,313 q7,6 14,0" fill="none" stroke="#34306A" stroke-width="3.2" stroke-linecap="round"/>
    <path d="M170,313 q7,6 14,0" fill="none" stroke="#34306A" stroke-width="3.2" stroke-linecap="round"/>
    <!-- gentle smile -->
    <path d="M150,335 q15,13 30,0" fill="none" stroke="#34306A" stroke-width="3.2" stroke-linecap="round"/>

    <text x="165" y="492" fill="#F2F2FA" font-size="25" font-weight="500" text-anchor="middle">Rendered Avatar</text>
    <text x="165" y="524" fill="#A6A6CA" font-size="15.5" font-weight="300" text-anchor="middle">A designed coach figure with</text>
    <text x="165" y="546" fill="#A6A6CA" font-size="15.5" font-weight="300" text-anchor="middle">real, recognisable personality.</text>

    <rect x="34" y="592" width="262" height="92" rx="18" fill="#FFFFFF"/>
    <path d="M58,662 Q58,632 84,632 Q110,632 110,662 Z" fill="url(#bust)"/>
    <circle cx="84" cy="628" r="17" fill="url(#avatarForm)"/>
    <path d="M75,625 q5,4 10,0" fill="none" stroke="#34306A" stroke-width="2.2" stroke-linecap="round"/>
    <path d="M84,635 q5,5 10,0" fill="none" stroke="#34306A" stroke-width="2.2" stroke-linecap="round" transform="translate(-9,0)"/>
    <rect x="120" y="618" width="150" height="9" rx="4.5" fill="#C9CEDC"/>
    <rect x="120" y="636" width="168" height="9" rx="4.5" fill="#D7DBE6"/>
    <rect x="120" y="654" width="110" height="9" rx="4.5" fill="#E2E5EE"/>

    <rect x="52" y="788" width="226" height="34" rx="17" fill="#F0653E" fill-opacity="0.16" stroke="#F0653E" stroke-opacity="0.6"/>
    <text x="165" y="810" fill="#F58662" font-size="11.5" font-weight="600" letter-spacing="0.6" text-anchor="middle">DROPS BRAND RULE · HIGH LIFT</text>
  </g>

  <!-- ============ SPECTRUM AXIS ============ -->
  <line x1="245" y1="936" x2="1340" y2="936" stroke="url(#spectrum)" stroke-width="2.4" stroke-linecap="round"/>
  <path d="M1340,936 l-13,-6 l0,12 z" fill="#F0653E"/>
  <circle cx="245" cy="936" r="5" fill="#2BB98A"/>
  <circle cx="615" cy="936" r="5" fill="#E5A53A"/>
  <circle cx="985" cy="936" r="5" fill="#EE8A3C"/>
  <circle cx="1355" cy="936" r="4.5" fill="#F0653E"/>
  <text x="245" y="970" fill="#7E7EA6" font-size="13" font-weight="600" letter-spacing="2.5" text-anchor="middle">BRAND-PURE</text>
  <text x="1340" y="970" fill="#7E7EA6" font-size="13" font-weight="600" letter-spacing="2.5" text-anchor="end">MOST LITERAL</text>

  <text x="800" y="1012" fill="#5C5C82" font-size="14" font-weight="300" text-anchor="middle">01–02 build in pure SwiftUI animation (reuse the existing NoumCharacter) · 03–04 need new assets + an animation system. This choice gates the living-coach-presence work.</text>
</svg>
</body>
</html>
