<!doctype html><html><head><meta charset="utf-8"><style>
  html,body{margin:0;padding:0}
  body{width:1600px;height:1040px;background:#0a0c14;
    font-family:-apple-system,"SF Pro Display","Helvetica Neue",Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;text-rendering:geometricPrecision}
  text{font-family:-apple-system,"SF Pro Display","Helvetica Neue",Helvetica,Arial,sans-serif}
</style></head><body>
<svg width="1600" height="1040" viewBox="0 0 1600 1040" xmlns="http://www.w3.org/2000/svg">
<defs>
  <radialGradient id="bg" cx="50%" cy="12%" r="95%">
    <stop offset="0%" stop-color="#1a1e36"/><stop offset="55%" stop-color="#0e1020"/><stop offset="100%" stop-color="#070811"/>
  </radialGradient>
  <radialGradient id="liveScreen" cx="50%" cy="28%" r="85%">
    <stop offset="0%" stop-color="#2a2150"/><stop offset="48%" stop-color="#141233"/><stop offset="100%" stop-color="#0a0a18"/>
  </radialGradient>
  <linearGradient id="typeScreen" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#F6F7FC"/><stop offset="100%" stop-color="#FFFFFF"/>
  </linearGradient>
  <radialGradient id="glow" cx="50%" cy="50%" r="50%">
    <stop offset="0%" stop-color="#E9D4FF" stop-opacity="0.95"/><stop offset="45%" stop-color="#9A55EE" stop-opacity="0.55"/><stop offset="100%" stop-color="#9A55EE" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="orb" cx="38%" cy="30%" r="78%">
    <stop offset="0%" stop-color="#D2AEF9"/><stop offset="48%" stop-color="#8F47EB"/><stop offset="100%" stop-color="#5A24A6"/>
  </radialGradient>
  <filter id="bigGlow" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="13"/></filter>
  <filter id="soft" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="5"/></filter>
</defs>

<rect width="1600" height="1040" fill="url(#bg)"/>

<!-- HEADER -->
<text x="80" y="64" fill="#9B9BC4" font-size="17" font-weight="600" letter-spacing="7">NOUM</text>
<text x="80" y="116" fill="#F4F4FB" font-size="40" font-weight="200">Coach, reimagined as a <tspan fill="#C9A6FF" font-weight="300">call</tspan> <tspan fill="#7C7CA6" font-weight="200">— not a text thread</tspan></text>
<text x="1520" y="60" fill="#8585B0" font-size="13" font-weight="600" letter-spacing="3.5" text-anchor="end">TALK WITH NOUM · REDESIGN</text>
<text x="1520" y="90" fill="#B9B9D6" font-size="16" font-weight="300" text-anchor="end">Default = face-to-face. Type = IM-style with call controls.</text>
<line x1="80" y1="146" x2="1520" y2="146" stroke="#FFFFFF" stroke-opacity="0.09"/>

<!-- ============================ PHONE 1 — LIVE (default) ============================ -->
<g transform="translate(300,180)">
  <text x="200" y="-6" fill="#F2F2FA" font-size="22" font-weight="500" text-anchor="middle">Live <tspan fill="#54D6A8" font-size="13" font-weight="700" letter-spacing="1">● DEFAULT</tspan></text>
  <!-- device -->
  <rect x="0" y="14" width="400" height="812" rx="52" fill="#05060c" stroke="#23263a" stroke-width="2"/>
  <rect x="14" y="28" width="372" height="784" rx="42" fill="url(#liveScreen)"/>
  <!-- island -->
  <rect x="158" y="44" width="84" height="24" rx="12" fill="#000"/>
  <!-- live status row -->
  <circle cx="44" cy="98" r="4.5" fill="#FF5A5A"/>
  <text x="56" y="103" fill="#E6E6F2" font-size="13" font-weight="600" letter-spacing="1.5">LIVE</text>
  <text x="356" y="103" fill="#9A9AC0" font-size="13" font-weight="500" text-anchor="end" letter-spacing="0.5">02:14</text>

  <!-- the FACE: big reactive orb -->
  <circle cx="200" cy="276" r="118" fill="none" stroke="#D185FF" stroke-opacity="0.08" stroke-width="1.5"/>
  <circle cx="200" cy="276" r="98" fill="none" stroke="#D185FF" stroke-opacity="0.14" stroke-width="1.5"/>
  <circle cx="200" cy="276" r="84" fill="url(#glow)" filter="url(#bigGlow)"/>
  <circle cx="200" cy="276" r="70" fill="url(#orb)"/>
  <circle cx="200" cy="276" r="70" fill="none" stroke="#FFFFFF" stroke-opacity="0.16" stroke-width="1.2"/>
  <!-- waveform (speaking) -->
  <g fill="#F4ECFF" fill-opacity="0.92">
    <rect x="160" y="262" width="9" height="28" rx="4.5"/><rect x="176" y="250" width="9" height="52" rx="4.5"/>
    <rect x="192" y="240" width="9" height="72" rx="4.5"/><rect x="208" y="254" width="9" height="44" rx="4.5"/>
    <rect x="224" y="246" width="9" height="60" rx="4.5"/>
  </g>
  <text x="200" y="430" fill="#F4F4FA" font-size="22" font-weight="500" text-anchor="middle">Noum</text>
  <text x="200" y="456" fill="#A99FD0" font-size="15" font-weight="300" text-anchor="middle">is speaking…</text>

  <!-- live caption -->
  <rect x="40" y="486" width="320" height="74" rx="18" fill="#FFFFFF" fill-opacity="0.07"/>
  <text x="200" y="513" fill="#E7E4F5" font-size="15" font-weight="300" text-anchor="middle">Your last rep held composure under</text>
  <text x="200" y="535" fill="#E7E4F5" font-size="15" font-weight="300" text-anchor="middle">pressure — let's build on exactly that.</text>

  <!-- control bar (Zoom-style) -->
  <rect x="36" y="640" width="328" height="120" rx="32" fill="#FFFFFF" fill-opacity="0.06"/>
  <!-- Mic (active + listening ring) -->
  <circle cx="98" cy="688" r="33" fill="none" stroke="#8F47EB" stroke-opacity="0.5" stroke-width="2"/>
  <circle cx="98" cy="688" r="26" fill="#8F47EB"/>
  <rect x="93" y="676" width="10" height="18" rx="5" fill="#fff"/>
  <path d="M89,690 a9 9 0 0 0 18 0" stroke="#fff" stroke-width="2" fill="none"/>
  <line x1="98" y1="699" x2="98" y2="704" stroke="#fff" stroke-width="2"/>
  <text x="98" y="736" fill="#CFCDE6" font-size="12" font-weight="500" text-anchor="middle">Mic</text>
  <!-- Aloud (speaker, next to mic) -->
  <circle cx="166" cy="688" r="26" fill="#FFFFFF" fill-opacity="0.12" stroke="#54D6A8" stroke-opacity="0.6" stroke-width="1.5"/>
  <path d="M158,682 l5,0 l6,-5 l0,22 l-6,-5 l-5,0 Z" fill="#fff"/>
  <path d="M172,682 q4,6 0,12" stroke="#fff" stroke-width="2" fill="none"/>
  <path d="M176,679 q7,9 0,18" stroke="#fff" stroke-width="2" fill="none"/>
  <text x="166" y="736" fill="#CFCDE6" font-size="12" font-weight="500" text-anchor="middle">Aloud</text>
  <!-- Type -->
  <circle cx="234" cy="688" r="26" fill="#FFFFFF" fill-opacity="0.12"/>
  <rect x="221" y="680" width="26" height="17" rx="3" stroke="#fff" stroke-width="1.8" fill="none"/>
  <g fill="#fff"><circle cx="226" cy="685.5" r="1.2"/><circle cx="231" cy="685.5" r="1.2"/><circle cx="236" cy="685.5" r="1.2"/><circle cx="241" cy="685.5" r="1.2"/><circle cx="228.5" cy="691" r="1.2"/><circle cx="234" cy="691" r="1.2"/><circle cx="239.5" cy="691" r="1.2"/></g>
  <text x="234" y="736" fill="#CFCDE6" font-size="12" font-weight="500" text-anchor="middle">Type</text>
  <!-- Leave -->
  <circle cx="302" cy="688" r="26" fill="#FF5A5A" fill-opacity="0.92"/>
  <path d="M294,680 l16,16 M310,680 l-16,16" stroke="#fff" stroke-width="2.4" stroke-linecap="round"/>
  <text x="302" y="736" fill="#E7B7B7" font-size="12" font-weight="500" text-anchor="middle">Leave</text>
</g>
<!-- phone 1 caption -->
<text x="500" y="1016" fill="#8A8AB0" font-size="14.5" font-weight="300" text-anchor="middle">The orb is the face — it reacts to your voice live. You talk, it listens &amp; speaks back. Captions, not a transcript.</text>

<!-- ============================ PHONE 2 — TYPE (like IM mode) ============================ -->
<g transform="translate(900,180)">
  <text x="200" y="-6" fill="#F2F2FA" font-size="22" font-weight="500" text-anchor="middle">Type <tspan fill="#8A8AB0" font-size="13" font-weight="500">· like IM Mode</tspan></text>
  <rect x="0" y="14" width="400" height="812" rx="52" fill="#05060c" stroke="#23263a" stroke-width="2"/>
  <rect x="14" y="28" width="372" height="784" rx="42" fill="url(#typeScreen)"/>
  <rect x="158" y="44" width="84" height="24" rx="12" fill="#000"/>

  <!-- header -->
  <path d="M44,96 l-9,8 l9,8" stroke="#8A8AA8" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="78" cy="104" r="15" fill="url(#orb)"/>
  <g fill="#F4ECFF" fill-opacity="0.95"><rect x="72" y="100" width="2.6" height="8" rx="1.3"/><rect x="77" y="97" width="2.6" height="14" rx="1.3"/><rect x="82" y="101" width="2.6" height="6" rx="1.3"/></g>
  <text x="104" y="100" fill="#1A1B2E" font-size="17" font-weight="600">Noum</text>
  <text x="104" y="118" fill="#8A8AA0" font-size="12.5" font-weight="400">Type mode</text>
  <!-- Go live pill -->
  <rect x="276" y="90" width="84" height="28" rx="14" fill="#8F47EB" fill-opacity="0.12" stroke="#8F47EB" stroke-opacity="0.5"/>
  <circle cx="294" cy="104" r="3.5" fill="#8F47EB"/>
  <text x="304" y="108" fill="#8F47EB" font-size="12.5" font-weight="600">Go live</text>
  <line x1="32" y1="138" x2="368" y2="138" stroke="#000" stroke-opacity="0.06"/>

  <!-- coach bubble -->
  <text x="44" y="174" fill="#9A9AB0" font-size="11.5" font-weight="600">NOUM</text>
  <rect x="40" y="182" width="252" height="76" rx="20" fill="#EDF0F7"/>
  <text x="58" y="210" fill="#2A2C3E" font-size="14.5" font-weight="300">Want to run a quick rep, or talk</text>
  <text x="58" y="232" fill="#2A2C3E" font-size="14.5" font-weight="300">through what felt hard last time?</text>

  <!-- user bubble -->
  <text x="356" y="290" fill="#9A9AB0" font-size="11.5" font-weight="600" text-anchor="end">YOU</text>
  <rect x="150" y="298" width="210" height="50" rx="20" fill="#DCEBFF"/>
  <text x="340" y="328" fill="#15315E" font-size="14.5" font-weight="300" text-anchor="end">Talk through last time.</text>

  <!-- coach bubble 2 -->
  <text x="44" y="384" fill="#9A9AB0" font-size="11.5" font-weight="600">NOUM</text>
  <rect x="40" y="392" width="270" height="76" rx="20" fill="#EDF0F7"/>
  <text x="58" y="420" fill="#2A2C3E" font-size="14.5" font-weight="300">Got it. You said the open felt rushed —</text>
  <text x="58" y="442" fill="#2A2C3E" font-size="14.5" font-weight="300">let's slow the first ten seconds.</text>

  <!-- Zoom-style controls row (mic + aloud, side by side) -->
  <rect x="40" y="628" width="320" height="64" rx="20" fill="#F1F0F8" stroke="#000" stroke-opacity="0.05"/>
  <!-- mic -->
  <circle cx="78" cy="660" r="22" fill="#3378F5" fill-opacity="0.12"/>
  <rect x="73.5" y="650" width="9" height="16" rx="4.5" fill="#3378F5"/>
  <path d="M70,662 a8 8 0 0 0 16 0" stroke="#3378F5" stroke-width="2" fill="none"/>
  <line x1="78" y1="670" x2="78" y2="674" stroke="#3378F5" stroke-width="2"/>
  <text x="108" y="656" fill="#3A3C50" font-size="13.5" font-weight="500">Dictate</text>
  <text x="108" y="673" fill="#9A9AB0" font-size="11.5" font-weight="300">speak instead of typing</text>
  <!-- aloud toggle (right next to mic) -->
  <circle cx="252" cy="660" r="22" fill="#1A9966" fill-opacity="0.14"/>
  <path d="M244,654 l5,0 l6,-5 l0,22 l-6,-5 l-5,0 Z" fill="#1A9966"/>
  <path d="M258,654 q4,6 0,12" stroke="#1A9966" stroke-width="2" fill="none"/>
  <text x="282" y="656" fill="#3A3C50" font-size="13.5" font-weight="500">Aloud</text>
  <text x="282" y="673" fill="#9A9AB0" font-size="11.5" font-weight="300">read replies out</text>

  <!-- composer -->
  <rect x="40" y="710" width="266" height="48" rx="24" fill="#FFFFFF" stroke="#000" stroke-opacity="0.10"/>
  <text x="62" y="739" fill="#9A9AB0" font-size="14.5" font-weight="300">Message Noum…</text>
  <circle cx="336" cy="734" r="24" fill="#3378F5"/>
  <path d="M336,745 l0,-22 M327,732 l9,-9 l9,9" stroke="#fff" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
</g>
<!-- phone 2 caption -->
<text x="1100" y="1016" fill="#8A8AB0" font-size="14.5" font-weight="300" text-anchor="middle">"Type instead" = a real conversation view. Mic to dictate + Speak-aloud toggle right beside it — Zoom-style.</text>
</svg>
</body></html>
